name: CI
on:
  # docs、README、別の workflow だけの変更では走らせない。master は保護していないので、check がない PR もマージできる
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.claude/**'
      - '.github/workflows/monitor.yml'
      - '.github/workflows/check-links.yml'
      - '.github/workflows/deploy-check.yml'
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.claude/**'
      - '.github/workflows/monitor.yml'
      - '.github/workflows/check-links.yml'
      - '.github/workflows/deploy-check.yml'

jobs:
  # 記事は vault で直し、pnpm sync:vault が master に push する（docs/operations の 2 章）。
  # PR で記事が変わっていたら、それは vault を通っていない変更
  posts-from-vault:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- src/content/posts)
          if [ -n "$changed" ]; then
            echo "::error::記事は vault の Published/webmanab/ で直して pnpm sync:vault で写す。この PR で変わった記事:"
            echo "$changed"
            exit 1
          fi

  check:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://webmanab.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:dist
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # axe は報告だけ。増えたら警告と Job Summary に出し、マージは止めない（08 の 2.6）
      - run: pnpm test:a11y
        continue-on-error: true
      - run: pnpm audit --audit-level high

  # 部品のカタログ（07 の 13.1）。止めるのはビルドと操作のテストだけ。
  # スクリーンショットは macOS の基準しかないので、ここでは比べない
  catalog:
    runs-on: ubuntu-24.04
    env:
      SITE_URL: https://webmanab.netlify.app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:catalog
      - run: pnpm exec playwright install --with-deps chromium
      # a11y-report.json と .md は globalTeardown で書かれる
      - run: pnpm test:catalog --ignore-snapshots
      # axe は報告だけ。増えたら警告と Job Summary に出し、マージは止めない（08 の 2.7）
      - if: always() && hashFiles('a11y-report.json') != ''
        run: |
          node scripts/a11y-compare.ts --baseline test/a11y/baseline-catalog.json --report a11y-report.json
          { echo; cat a11y-report.md; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report-catalog
          path: |
            a11y-report.json
            a11y-report.md
          if-no-files-found: ignore
