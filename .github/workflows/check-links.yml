# 記事の外部リンクの死活を月 1 回調べ、一覧を Job Summary に出す（08 の 1.3）。一覧を出すだけで何も直さない
name: Check links
on:
  schedule:
    - cron: '0 0 1 * *' # 毎月 1 日 9:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: check
        shell: bash
        run: |
          pnpm --silent check:links | tee links.log
          echo "summary=$(grep -m1 '件を調べた' links.log)" >> "$GITHUB_OUTPUT"
      - name: Notify Moshi
        if: always()
        shell: bash
        env:
          MOSHI_TOKEN: ${{ secrets.MOSHI_TOKEN }}
          OUTCOME: ${{ steps.check.outcome }}
          SUMMARY: ${{ steps.check.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$MOSHI_TOKEN" ] || exit 0
          if [ "$OUTCOME" = success ]; then message="${SUMMARY} ${RUN_URL}"; else message="調べる途中で落ちた（${OUTCOME}） ${RUN_URL}"; fi
          jq -n --arg token "$MOSHI_TOKEN" --arg message "$message" \
            '{token: $token, title: "webmanab: 外部リンク", message: $message}' |
            curl -s -X POST https://api.getmoshi.app/api/webhook -H 'Content-Type: application/json' -d @-
