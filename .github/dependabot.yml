version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      # 旧サイトと同じ自動判定にするため 10.1.1 に固定している
      - dependency-name: highlight.js
      - dependency-name: hljs10
      # 基準スクリーンショットと同じ Chromium で比べるため固定している
      - dependency-name: '@playwright/test'
    groups:
      dev-tools:
        dependency-type: development
      astro:
        patterns: ['astro', '@astrojs/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
