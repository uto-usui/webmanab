version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    ignore:
      # 旧サイトと同じ自動判定にするため 10.1.1 に固定している
      - dependency-name: highlight.js
      - dependency-name: hljs10
      # 基準スクリーンショットと同じ Chromium で比べるため固定している
      - dependency-name: '@playwright/test'
    # PR を依存ごとに分けず、まとめて 1 本にする。major は壊れやすいので個別の PR のまま
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      # security updates は schedule と cooldown が効かず、見つかるたびに出る。せめて 1 本にまとめる
      security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
