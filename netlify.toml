[build]
  command = "pnpm build"
  publish = "dist"
  # 本番に使わないファイル（docs、テスト、カタログ、道具）だけの変更ではビルドしない。対象は scripts/netlify-ignore.sh
  ignore = "sh scripts/netlify-ignore.sh"

[build.environment]
  # canonical / OGP / sitemap / RSS / robots.txt の絶対 URL のもと。プレビューでも本番の URL を使う
  SITE_URL = "https://webmanab.com"

# 広告と GA4 は本番だけ。値がないとタグを出さない作りにしてある
[context.production.environment]
  PUBLIC_ADSENSE_CLIENT = "ca-pub-2691922878827958"
  # PUBLIC_GA4_ID = "G-XXXXXXXXXX"  # ID を用意したら有効にする

# AdSense に関係しないものだけ。script-src は AdSense が読む先が多いので入れない（08 の 5.1、5.2）
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# netlify.app で覚えられた URL を webmanab.com にまとめる（06 の 3 章）。www と http は Netlify が 301 で apex に寄せる
[[redirects]]
  from = "https://webmanab.netlify.app/*"
  to = "https://webmanab.com/:splat"
  status = 301
  force = true
